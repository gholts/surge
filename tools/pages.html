<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{title}}</title>
        <style>
            :root {
                color-scheme: light dark;
                --background: #ffffff;
                --text: #202830;
                --muted: #687580;
                --line: #dce1e6;
                --focus: #1b51ce;
            }
            * {
                box-sizing: border-box;
            }
            body {
                max-width: 42rem;
                margin: 64px auto;
                padding: 0 24px;
                background: var(--background);
                color: var(--text);
                font:
                    14px/2 ui-monospace,
                    "SFMono-Regular",
                    Menlo,
                    Consolas,
                    monospace;
            }
            a {
                color: inherit;
                text-decoration: none;
                overflow-wrap: anywhere;
            }
            a:hover {
                text-decoration: underline;
                text-underline-offset: 4px;
            }
            a:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 4px;
            }
            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 0 6px;
                margin-bottom: 24px;
            }
            ul {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            ul ul {
                margin-left: 6px;
                padding-left: 20px;
                border-left: 1px solid var(--line);
            }
            h1 {
                margin: 0;
                font-size: 32px;
                font-weight: 400;
            }
            footer {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 8px 24px;
                margin-top: 40px;
                color: var(--muted);
                font-size: 12px;
            }
            @media (max-width: 480px) {
                body {
                    margin: 24px auto;
                    padding: 0 20px;
                }
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --background: #181a1d;
                    --text: #e4e6e8;
                    --muted: #a2a7af;
                    --line: #363c44;
                    --focus: #9cbaff;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <nav aria-label="Path">{{navigation}}</nav>
            {{content}}
        </main>
        <footer>
            <time datetime="{{timestamp}}" title="Updated">{{updated}}</time>
            <a href="https://github.com/gholts/surge">gholts/surge</a>
        </footer>
    </body>
</html>
